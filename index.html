<style amp-custom>
:root{
  --bg:#000000;
  --text:#ffffff;

  /* BERU SHADOW PURPLE */
  --shadow-purple:#00c0ff;
  --shadow-light:#00c0ff;
  --shadow-deep:#00c0ff;
  --shadow-violet:#00c0ff;
  --shadow-neon:#00c0ff;

  --glow-main:#00c0ff;
  --glow-soft:#00c0ff;
  --glow-white:#00c0ff;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  height:100%;
}

body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;
  color:var(--text);

  background:
    radial-gradient(circle at top,
    rgba(0,192,255,.26),
    transparent 35%),

    radial-gradient(circle at bottom,
    rgba(0,192,255,.18),
    transparent 36%),

    linear-gradient(
    180deg,
    #000000,
    #000000,
    #000000);

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:16px;

  overflow-x:hidden;
}

/* MAIN SHELL */
.shell{
  max-width:520px;
  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}

/* HEADER */
.header{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:6px;
  background:transparent;
}

.logo{
  display:block;
  background:transparent;
  border:0;
  border-radius:0;
  box-shadow:none;
  filter:none;
}

.logo img{
  object-fit:contain;
}

/* BERU CARD */
.card{
  position:relative;

  width:100%;

  padding:20px;

  overflow:hidden;

  border-radius:22px;

  border:2px solid rgba(0,192,255,.52);

  background:
    linear-gradient(
    180deg,
    rgba(0,192,255,.13),
    rgba(0,192,255,.08));

  box-shadow:
    0 0 38px rgba(0,192,255,.42),
    0 0 78px rgba(0,192,255,.24),
    inset 0 0 22px rgba(0,192,255,.08),
    0 12px 45px rgba(0,0,0,.82);

  transition:all .35s ease;
}

.card:hover{
  transform:translateY(-3px) scale(1.01);

  box-shadow:
    0 0 54px rgba(0,192,255,.68),
    0 0 110px rgba(0,192,255,.34),
    inset 0 0 30px rgba(0,192,255,.14),
    0 14px 58px rgba(0,0,0,.9);
}

/* BERU SHADOW AURA */
.card::before{
  content:"";

  position:absolute;
  top:-50%;
  left:-50%;

  width:200%;
  height:200%;

  background:
    radial-gradient(circle,
    rgba(0,192,255,.24),
    rgba(0,192,255,.10),
    transparent 70%);

  animation:beruShadowRotate 8s linear infinite;

  filter:blur(30px);

  z-index:0;
}

/* VOID GLOW */
.card::after{
  content:"";

  position:absolute;
  inset:auto -20% -30% auto;

  width:220px;
  height:220px;

  background:
    radial-gradient(circle,
    rgba(0,192,255,.22),
    transparent 70%);

  filter:blur(42px);

  z-index:0;
}

@keyframes beruShadowRotate{
  0%{
    transform:
    translate(-50%,-50%)
    rotate(0deg);
  }

  100%{
    transform:
    translate(-50%,-50%)
    rotate(360deg);
  }
}

/* HERO */
.hero{
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;

  position:relative;
  z-index:1;
}


.hero-link{
  display:block;
  width:100%;
  text-decoration:none;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
  z-index:1;
}

.hero-img{
  width:100%;
  height:auto;
  display:block;

  border-radius:16px;

  border:2px solid rgba(0,192,255,.42);

  box-shadow:
    0 0 22px rgba(0,192,255,.55),
    0 0 55px rgba(0,192,255,.28),
    0 0 80px rgba(0,192,255,.18);
}

/* CTA */
.cta{
  display:flex;
  gap:12px;
  width:100%;
  justify-content:center;
  flex-wrap:wrap;

  position:relative;
  z-index:1;
}

/* BUTTON */
.btn{
  flex:1 1 45%;

  display:inline-block;

  text-decoration:none;
  text-align:center;

  padding:15px 16px;

  border-radius:14px;

  font-weight:800;
  letter-spacing:.4px;

  color:#fff;

  background:#000000;

  position:relative;

  overflow:hidden;

  transition:all .3s ease;

  z-index:1;
}

/* BERU ROTATING BORDER */
.btn::before{
  content:"";

  position:absolute;
  top:-3px;
  left:-3px;
  right:-3px;
  bottom:-3px;

  background:
    conic-gradient(
    from 0deg,
    var(--shadow-light),
    var(--shadow-neon),
    var(--shadow-purple),
    var(--shadow-deep),
    var(--shadow-violet),
    var(--shadow-light));

  border-radius:16px;

  z-index:-2;

  animation:rotateBeruBorder 3s linear infinite;

  filter:blur(8px);
}

/* INNER */
.btn::after{
  content:"";

  position:absolute;
  inset:3px;

  background:#000000;

  border-radius:12px;

  z-index:-1;
}

.btn:hover{
  transform:translateY(-3px) scale(1.03);

  box-shadow:
    0 0 36px rgba(0,192,255,.88),
    0 0 66px rgba(0,192,255,.48),
    0 0 46px rgba(0,192,255,.36);

  animation:beruPulse 1s infinite;
}

@keyframes rotateBeruBorder{
  to{
    transform:rotate(360deg);
  }
}

@keyframes beruPulse{
  0%{
    box-shadow:
      0 0 26px rgba(0,192,255,.68);
  }

  50%{
    box-shadow:
      0 0 58px rgba(0,192,255,.95),
      0 0 88px rgba(0,192,255,.55),
      0 0 52px rgba(0,192,255,.34);
  }

  100%{
    box-shadow:
      0 0 26px rgba(0,192,255,.68);
  }
}

/* SECTION BUTTONS */
.section-buttons{
  display:flex;
  flex-direction:column;
  gap:12px;

  width:100%;

  position:relative;
  z-index:1;
}

.badge-container{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

/* BADGE */
.badge{
  flex:1 1 30%;

  display:inline-block;

  text-decoration:none;
  text-align:center; 

  padding:11px 12px;

  border-radius:12px;

  font-weight:800;
  letter-spacing:.2px;

  font-size:12px;

  color:#fff;

  background:#000000;

  position:relative;

  overflow:hidden;

  transition:all .3s ease;

  z-index:1;
}

.badge::before{
  content:"";

  position:absolute; 
  top:-3px;
  left:-3px;
  right:-3px;
  bottom:-3px;

  background:
    conic-gradient(
    from 0deg,
    #00c0ff,
    #00c0ff,
    #00c0ff,
    #00c0ff,
    #00c0ff,
    #00c0ff);

  border-radius:14px;

  z-index:-2;

  animation:rotateBeruBorder 4s linear infinite;

  filter:blur(8px);
} 

.badge::after{
  content:"";

  position:absolute;
  inset:3px;

  background:#000000;

  border-radius:10px;

  z-index:-1;
}

.badge:hover{
  transform:scale(1.06);

  box-shadow:
    0 0 32px rgba(0,192,255,.82),
    0 0 60px rgba(0,192,255,.45),
    0 0 40px rgba(0,192,255,.34);
} 


/* CLICKABLE GIF BOX */
.gif-box{
  width:100%;
  position:relative;
  z-index:1;
}

.gif-link{
  width:100%;
  display:block;
  padding:12px 16px;
  background:#000000;
  border:1px solid rgba(0,192,255,.75);
  border-radius:14px;
  text-decoration:none;
  overflow:hidden;
  box-shadow:
    0 0 18px rgba(0,192,255,.28),
    inset 0 0 14px rgba(0,192,255,.10);
  transition:transform .3s ease, box-shadow .3s ease;
}

.gif-link:hover{
  transform:translateY(-2px);
  box-shadow:
    0 0 30px rgba(0,192,255,.55),
    inset 0 0 18px rgba(0,192,255,.16);
}

.gif-media{
  width:72%;
  max-width:320px;
  margin:0 auto;
}

.promo-gif{
  display:block;
  width:100%;
  border:0;
  background:transparent;
}

/* FOOTER */
.footer{
  text-align:center;

  color:#ffffff;

  font-size:12px;

  padding:8px 0 0;

  margin-top:8px;

  position:relative;
  z-index:1;

  text-shadow:
    0 0 10px rgba(0,192,255,.55),
    0 0 18px rgba(0,192,255,.38);
}

.footer b{
  color:#00c0ff;
}



/* MBAKTOTO OPENING INTRO ANIMATION - COLOR MATCHED TO THIS FILE */
.card{
  isolation:isolate;
}

.mbaktoto-opening{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  pointer-events:none;
  background:#000914;
  border-radius:22px;
  animation:mbaktotoOpeningHide .7s cubic-bezier(.22,1,.36,1) 2.35s forwards;
}

.mbaktoto-opening::before,
.mbaktoto-opening::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:51%;
  background:
    radial-gradient(circle at center, rgba(0,192,255,.30), transparent 56%),
    linear-gradient(145deg, #006c91, #00101a 58%, #00a5db);
  box-shadow:inset 0 0 34px rgba(0,192,255,.24);
  animation-duration:.85s;
  animation-timing-function:cubic-bezier(.77,0,.18,1);
  animation-delay:1.75s;
  animation-fill-mode:forwards;
}

.mbaktoto-opening::before{
  left:0;
  border-right:1px solid rgba(0,192,255,.48);
  animation-name:mbaktotoPanelLeft;
}

.mbaktoto-opening::after{
  right:0;
  border-left:1px solid rgba(0,192,255,.48);
  animation-name:mbaktotoPanelRight;
}

.mbaktoto-opening-center{
  position:relative;
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.mbaktoto-opening-seal{
  position:relative;
  width:72px;
  height:72px;
  margin-bottom:24px;
  opacity:0;
  transform:rotate(45deg) scale(.15);
  background:linear-gradient(145deg,#008fbd,#00131f 48%,#00c0ff);
  border:2px solid rgba(87,220,255,.92);
  box-shadow:
    0 0 0 7px rgba(0,0,0,.18),
    0 0 32px rgba(0,192,255,.78),
    inset 0 1px 0 rgba(210,248,255,.24),
    inset 0 -9px 18px rgba(0,70,95,.42);
  animation:mbaktotoSealReveal 1.05s cubic-bezier(.22,1,.36,1) .1s forwards;
  overflow:hidden;
}

.mbaktoto-opening-icon{
  position:absolute;
  top:50%;
  left:50%;
  width:50px;
  height:50px;
  object-fit:contain;
  transform:translate(-50%,-50%) rotate(-45deg);
  filter:drop-shadow(0 0 10px rgba(0,192,255,.90));
  animation:mbaktotoIconCounter 1.05s cubic-bezier(.22,1,.36,1) .1s forwards;
}

@keyframes mbaktotoIconCounter{
  0%{
    transform:translate(-50%,-50%) rotate(-45deg) scale(.92);
  }
  65%{
    transform:translate(-50%,-50%) rotate(-225deg) scale(1.04);
  }
  100%{
    transform:translate(-50%,-50%) rotate(-225deg) scale(1);
  }
}

.mbaktoto-opening-brand{
  position:relative;
  overflow:hidden;
  color:#fff;
  font-size:25px;
  font-weight:800;
  line-height:1;
  letter-spacing:4px;
  text-align:center;
  text-shadow:
    0 0 20px rgba(0,192,255,.92),
    0 4px 14px rgba(0,0,0,.55);
  opacity:0;
  transform:translateY(18px);
  animation:mbaktotoBrandReveal .75s cubic-bezier(.22,1,.36,1) .7s forwards;
}

.mbaktoto-opening-brand::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:-55%;
  width:30%;
  background:linear-gradient(90deg, transparent, rgba(141,235,255,.98), transparent);
  transform:skewX(-18deg);
  animation:mbaktotoBrandShine .75s ease 1.18s forwards;
}

.mbaktoto-opening-line{
  width:0;
  height:2px;
  margin-top:15px;
  background:linear-gradient(90deg, transparent, #00c0ff, #b9f4ff, #00c0ff, transparent);
  box-shadow:0 0 14px rgba(0,192,255,.94);
  animation:mbaktotoLineExpand .65s ease 1s forwards;
}

.mbaktoto-opening-subtitle{
  margin-top:10px;
  color:#c9f6ff;
  font-size:9px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  opacity:0;
  animation:mbaktotoSubtitleReveal .5s ease 1.2s forwards;
}

@keyframes mbaktotoSealReveal{
  0%{
    opacity:0;
    transform:rotate(45deg) scale(.15);
  }
  65%{
    opacity:1;
    transform:rotate(225deg) scale(1.12);
  }
  100%{
    opacity:1;
    transform:rotate(225deg) scale(1);
  }
}

@keyframes mbaktotoBrandReveal{
  to{
    opacity:1;
    transform:translateY(0);
    letter-spacing:2.8px;
  }
}

@keyframes mbaktotoBrandShine{
  to{left:130%;}
}

@keyframes mbaktotoLineExpand{
  to{width:180px;}
}

@keyframes mbaktotoSubtitleReveal{
  to{opacity:.88;}
}

@keyframes mbaktotoPanelLeft{
  to{transform:translateX(-105%);}
}

@keyframes mbaktotoPanelRight{
  to{transform:translateX(105%);}
}

@keyframes mbaktotoOpeningHide{
  to{
    opacity:0;
    visibility:hidden;
  }
}

</style>
